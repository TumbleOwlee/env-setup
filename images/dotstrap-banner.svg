<stop offset="0" stop-color="#1A1F24"/>
<stop offset="1" stop-color="#0C0F12"/>
</linearGradient>
<linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#444B52"/>
<stop offset="1" stop-color="#2A3036"/>
</linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7E6040"/>
<stop offset="0.35" stop-color="#DDBA80"/>
<stop offset="0.6" stop-color="#C49A63"/>
<stop offset="1" stop-color="#6E5236"/>
</linearGradient>
</defs>

