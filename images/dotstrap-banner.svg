<svg width="100%" viewBox="0 0 684 232" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Dotstrap banner</title>
<desc>A wide README banner: a small terminal window stands on a steel rail, listing .config, .tmux.conf and .gitconfig with green check marks; to the right are the wordmark dotstrap, a tagline, and tags for fish, tmux, neovim, rust, docker and desktop.</desc>
