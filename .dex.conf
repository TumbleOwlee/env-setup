[project]
profile = ubuntu

[ubuntu]
image = ubuntu:latest

[alias:shell]
desc = Run bash shell.
cmd = /bin/bash
interactive = true

[alias:setup]
desc = Run setup.sh script.
cmd = ./Unix/setup.sh --debug --noconfirm --skip=docker --skip=alacritty

[arch]
image = archlinux:latest

[alias:shell]
desc = Run bash shell.
cmd = /bin/bash
interactive = true

[alias:setup]
desc = Run setup.sh script.
cmd = ./Unix/setup.sh --debug --noconfirm --skip=docker --skip=alacritty
