set-option -g history-limit 8000
set-option -sg escape-time 10
set-option -g focus-events on
set-option -sa terminal-features ',screen-256color:RGB'
set-option -g status on
set-option -g status-position bottom
set-option -g status-style fg=black,bg=#b37b38

set-window-option -g mode-keys vi

set -g window-status-current-style bg=default,reverse
set -g window-status-separator ''
set -g window-status-format " #{?window_start_flag,, }#I:#W#{?window_flags,#F, } "
set -g window-status-current-format " #{?window_start_flag,, }#I:#W#{?window_flags,#F, } "

bind-key -n C-1 select-window -t :0
bind-key -n C-2 select-window -t :1
bind-key -n C-3 select-window -t :2
bind-key -n C-4 select-window -t :3
bind-key -n C-5 select-window -t :4
bind-key -n C-6 select-window -t :5
bind-key -n C-7 select-window -t :6
bind-key -n C-8 select-window -t :7
bind-key -n C-9 select-window -t :8
bind-key -n C-0 select-window -t :9

set -g set-clipboard on
set -as terminal-features ',*:clipboard'

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# Required for Claude CLI
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Pane status line
set -g pane-border-format "#{?pane_active,#[reverse],}#[bold,fg=#111111,bg=#b37b38] #{session_name}:#{window_index}.#{pane_index} #[default]"
set -g pane-active-border-style "fg=yellow,bg=#111111"
set -g pane-border-style "fg=yellow,bg=#111111"
set -g pane-border-status top

# Scrolling
set -g mouse on
bind -n S-PPage copy-mode -eu
bind -T copy-mode-vi S-PPage send -X page-up
bind -T copy-mode-vi S-NPage send -X page-down
bind -T copy-mode-vi S-Up send -X scroll-up
bind -T copy-mode-vi S-Down send -X scroll-down

# Machine-specific overrides (written by setup)
source-file -q ~/.config/tmux/env-setup.local.conf
